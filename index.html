<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="Alison de la Paz"/><meta name="description" content="Spots Project"/><meta name="keywords" content="photos, photo-descriptions, photo-uploads, like-buttons"/><link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/><title>Spots</title><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img id="image-logo" alt="Spots Text Logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><img id="image-avatar" alt="Headshot of Bessie Coleman" class="profile__avatar"/><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-button"><img id="pencil-icon" alt="Pencil Icon"/>Edit Profile</button></div><button type="button" class="profile__add-button"><img id="plus-icon" alt="New Post Icon"/> New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><img src="" alt="" class="card__image"/> <button id="card-delete-button" class="card__delete"></button><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__copyright">2025 &copy; Alison de la Paz</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-button"></button><h2 class="modal__title">Edit Profile</h2><form name="edit-profile" class="modal__form" novalidate><label for="profile-name" class="modal__label">Name</label> <input id="profile-name" name="name" class="modal__input" placeholder="Type your name" required minlength="2" maxlength="40"/> <span
